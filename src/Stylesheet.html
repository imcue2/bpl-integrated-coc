<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ---- Design tokens ("blueprint" wireframe system) ---- */
  :root {
    --color-bg: #ffffff;
    --color-surface: #e9e9ea;
    --color-text: #1d1f20;
    --color-accent: #087fb4;
    --color-divider: rgba(29, 31, 32, 0.16);
    --danger: #b51d26;

    --neutral-100: #f5f5f8; --neutral-200: #e7e7ea; --neutral-300: #d4d4d7;
    --neutral-400: #b7b7ba; --neutral-500: #98989b; --neutral-600: #7a7a7d;
    --neutral-700: #5d5d60; --neutral-800: #424244; --neutral-900: #2b2b2d;

    --accent-100: #e6f8ff; --accent-200: #c4efff; --accent-300: #8ddfff;
    --accent-400: #63c3fb; --accent-500: #3da3db; --accent-600: #1683b8;
    --accent-700: #006592; --accent-800: #00486b; --accent-900: #032f46;

    /* Color-coded status text (Registered/Compiled/Dialled-up/Completed) —
       plain colored text, no badge/box, so tables stay compact. */
    --status-registered: var(--neutral-700);
    --status-compiled: var(--color-accent);
    --status-dialled: #9c6b00;
    --status-completed: #1e8e3e;

    --space-1: 3.4px; --space-2: 6.8px; --space-3: 10.2px; --space-4: 13.6px;
    --space-5: 20.4px; --space-6: 27.2px;
    --font-heading: 'Barlow Condensed', system-ui, sans-serif;
    --font-body: 'Barlow', system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.55;
    color: var(--color-text);
    background: var(--color-bg);
  }
  h1, h2, h3, h4, h5, h6 { font-family: var(--font-heading); font-weight: 600; letter-spacing: -0.015em; margin: 0; }
  h4 { font-size: 20px; }
  h5 { font-size: 16px; }
  h6 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; }

  /* ---- Buttons ---- */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--font-heading); font-weight: 600; font-size: 14px;
    padding: var(--space-2) calc(var(--space-3) * 1.2);
    border: 1px solid var(--color-divider); background: transparent; color: var(--color-text);
    cursor: pointer; position: relative;
  }
  .btn-primary { border-color: var(--color-accent); background: var(--color-accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-700); }
  .btn-primary:active { background: var(--accent-800); }
  .btn-secondary:hover { background: rgba(29, 31, 32, 0.04); }
  .btn-ghost { border-color: transparent; color: var(--color-accent); }
  .btn-ghost:hover { background: var(--accent-100); }
  .btn-block { width: 100%; justify-content: center; margin-top: var(--space-2); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-danger { border-color: var(--danger); color: var(--danger); }
  .btn-danger:hover { background: rgba(181, 29, 38, 0.06); }

  /* ---- Corner tick marks (the signature "blueprint" register marks) ---- */
  .blueprint { position: relative; }
  .corner { position: absolute; width: 11px; height: 11px; pointer-events: none; }
  .corner.tl { top: -6px; left: -6px; }
  .corner.tr { top: -6px; right: -6px; }
  .corner.bl { bottom: -6px; left: -6px; }
  .corner.br { bottom: -6px; right: -6px; }
  .corner::before, .corner::after { content: ''; position: absolute; background: rgba(29, 31, 32, 0.55); }
  .corner::before { top: 5px; left: 0; width: 11px; height: 1px; }
  .corner::after { top: 0; left: 5px; width: 1px; height: 11px; }

  /* ---- Forms ---- */
  .field { margin-bottom: var(--space-4); }
  .field-row { display: flex; gap: var(--space-4); flex-wrap: wrap; }
  .field-row .field { flex: 1; min-width: 200px; }
  .field > label { display: block; font-size: 12px; opacity: 0.7; margin-bottom: 5px; }
  .field > label .req { color: var(--danger); }
  .input, select, input, textarea {
    width: 100%; min-height: 36px; padding: 6px 10px; font-size: 14px; font-family: var(--font-body);
    background: var(--color-surface); border: 1px solid var(--color-divider); color: var(--color-text);
  }
  .input:hover, select:hover, input:hover, textarea:hover { border-color: var(--neutral-500); }
  .input:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: none; border-color: var(--color-accent);
  }
  .input:disabled, select:disabled, input:disabled, textarea:disabled { opacity: 0.55; cursor: not-allowed; }

  /* ---- Segmented control (pill row) ---- */
  .seg { display: inline-flex; border: 1px solid var(--color-divider); }
  .seg-opt { position: relative; cursor: pointer; }
  .seg-opt input { position: absolute; opacity: 0; width: 0; height: 0; }
  .seg-opt span {
    display: block; padding: 6px 14px; font-family: var(--font-heading); font-weight: 600; font-size: 13px;
    border-right: 1px solid var(--color-divider);
  }
  .seg-opt:last-child span { border-right: none; }
  .seg-opt:has(input:checked) span { background: var(--color-accent); color: #fff; }

  /* ---- Cards ---- */
  .card { background: transparent; border: 1px solid var(--color-divider); display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-3) var(--space-4); }
  .card-kicker { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-accent); }
  .card-title { font-family: var(--font-heading); font-size: 17px; font-weight: 600; }
  .card-title.big { font-size: 28px; }
  .card-body { font-size: 13px; opacity: 0.8; }
  .card-meta { font-size: 11px; opacity: 0.5; }
  .card ul { list-style: none; margin: 0; padding: 0; }
  .card li { padding: 4px 0; border-bottom: 1px solid rgba(29, 31, 32, 0.08); font-size: 13px; }
  .card li:last-child { border-bottom: none; }
  .card .empty { color: var(--neutral-700); font-size: 13px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: var(--space-4); margin-bottom: var(--space-5); }

  /* ---- Tags / badges ---- */
  .tag { display: inline-block; font-size: 11px; padding: 3px 10px; }
  .tag-accent { background: var(--accent-100); color: var(--accent-800); }
  .tag-neutral { background: var(--neutral-100); color: var(--neutral-800); }
  .tag-outline { background: transparent; color: var(--color-accent); border: 1px solid var(--color-accent); }
  .tag-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }

  /* ---- Status text (color-coded, no box — replaces .tag for progress/status columns) ---- */
  .status-text { font-weight: 600; }
  .status-registered { color: var(--status-registered); }
  .status-compiled { color: var(--status-compiled); }
  .status-dialled { color: var(--status-dialled); }
  .status-completed { color: var(--status-completed); }

  /* ---- Nav ---- */
  header.app-header {
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-4);
    padding: var(--space-3) var(--space-5); border-bottom: 2px solid var(--color-divider);
  }
  .app-header .brand { display: flex; align-items: baseline; gap: var(--space-2); }
  .app-header .brand-name { font-family: var(--font-heading); font-size: 19px; font-weight: 600; }
  .app-header .brand-sub { font-size: 13px; opacity: 0.6; }
  .app-header .who { text-align: right; font-size: 13px; }
  .app-header .who .name { font-weight: 700; }
  .app-header .version { font-size: 11px; opacity: 0.5; margin-bottom: 4px; }
  .app-header .header-actions { display: flex; gap: var(--space-2); justify-content: flex-end; }
  .app-header .header-actions .btn { padding: 4px 10px; font-size: 12px; }

  nav.tabs {
    display: flex; flex-wrap: wrap; gap: var(--space-1);
    padding: 0 var(--space-5); border-bottom: 1px solid var(--color-divider); overflow-x: auto;
  }
  nav.tabs button {
    background: none; border: none; font-family: var(--font-heading); font-weight: 600;
    color: var(--neutral-700); padding: var(--space-3) var(--space-3);
    cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap;
  }
  nav.tabs button.active { color: var(--color-accent); border-bottom-color: var(--color-accent); }

  nav.subtabs {
    display: flex; flex-wrap: wrap; gap: var(--space-2);
    background: var(--color-surface); border-bottom: 1px solid var(--color-divider);
    padding: var(--space-2) var(--space-5);
  }
  nav.subtabs button {
    background: transparent; border: 1px solid var(--color-divider); font-family: var(--font-heading);
    font-weight: 600; font-size: 13px; padding: 5px 14px; cursor: pointer; color: var(--color-text);
  }
  nav.subtabs button.active { background: var(--color-accent); color: #fff; border-color: var(--color-accent); }

  main { padding: var(--space-6) var(--space-5); max-width: 1280px; margin: 0 auto; }
  .panel { display: none; }
  .panel.active { display: block; }
  .subpanel { display: none; }
  .subpanel.active { display: block; }

  .toolbar { display: flex; gap: var(--space-4); align-items: flex-end; margin-bottom: var(--space-5); flex-wrap: wrap; }
  .toolbar .field { margin-bottom: 0; min-width: 180px; }

  /* ---- Tables ---- */
  table.data-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.data-table th {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.6; text-align: left;
    padding: 6px 4px; border-bottom: 1px solid var(--color-divider);
  }
  table.data-table td { padding: 6px 4px; border-bottom: 1px solid rgba(29, 31, 32, 0.08); }
  table.data-table tbody tr:hover { background: rgba(29, 31, 32, 0.04); }
  .amount-cell { font-weight: 700; }
  .amount-cell.danger { color: var(--danger); }

  form.card-form {
    background: transparent; border: 1px solid var(--color-divider); padding: var(--space-5); max-width: 560px;
  }
  .msg { margin-top: var(--space-3); font-size: 13px; }
  .msg.error { color: var(--danger); }
  .msg.success { color: var(--color-accent); }

  .section-title { font-family: var(--font-heading); font-size: 22px; font-weight: 600; margin: 0 0 var(--space-4); }
  .muted { color: var(--neutral-700); font-size: 0.85rem; }
  .footer-version { text-align: right; font-size: 11px; opacity: 0.5; padding: var(--space-3) var(--space-5); }

  /* ---- Dialogs (confirm/void prompts) ---- */
  .dialog-backdrop {
    position: fixed; inset: 0; background: rgba(43, 43, 45, 0.5);
    display: flex; align-items: center; justify-content: center; z-index: 1000;
  }
  .dialog { width: min(440px, calc(100% - 2 * var(--space-5))); background: var(--color-bg); border: 1px solid var(--color-divider); padding: var(--space-5); }
  .dialog-title { font-family: var(--font-heading); font-size: 20px; font-weight: 600; margin-bottom: var(--space-3); }
  .dialog-body { font-size: 14px; opacity: 0.85; margin-bottom: var(--space-4); }
  .dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); }

  .print-header { display: none; }
  .print-header img { height: 50px; width: auto; }
  .print-header-name { font-family: var(--font-heading); font-weight: 600; font-size: 16px; }
  .print-header-sub { font-size: 12px; opacity: 0.7; }

  @media print {
    .no-print { display: none !important; }
    main { padding: 8px 10px; }
    .print-header { display: flex !important; align-items: center; gap: var(--space-3); margin-bottom: var(--space-4); }

    /* 3 cards -> 1 row, split 1 / 2 / 1 across 4 equal columns. */
    .cards { grid-template-columns: repeat(4, 1fr); gap: var(--space-2); margin-bottom: var(--space-3); }
    .card-balance { grid-column: span 1; }
    .card-request { grid-column: span 2; }
    .card-topup { grid-column: span 1; }
    /* KPI: 2 cards, each takes half the row (2 of 4 parts). */
    .card-compiling { grid-column: span 2; }
    .card-dialling { grid-column: span 2; }
    .card { padding: 6px 8px; gap: 3px; }
    .card-kicker { font-size: 8px; }
    .card-title { font-size: 13px; }
    .card-title.big { font-size: 18px; }
    .card-meta { font-size: 9px; }
    .card li { padding: 2px 0; font-size: 10px; }

    .section-title { font-size: 13px; margin: 0 0 4px; }

    table.data-table { font-size: 8px; }
    table.data-table th {
      font-size: 7px; white-space: normal; padding: 2px 3px;
    }
    table.data-table td { padding: 2px 3px; }
  }
</style>
