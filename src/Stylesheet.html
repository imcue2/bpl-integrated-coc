<style>
  :root {
    --navy: #14202E;
    --navy-light: #1f3247;
    --green: #1e8e3e;
    --green-bg: #e6f4ea;
    --red: #c5221f;
    --red-bg: #fce8e6;
    --border: #d7dbe0;
    --text: #16202C;
    --muted: #5f6b7a;
    --bg: #f5f6f8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  header.app-header {
    background: var(--navy);
    color: #fff;
    padding: 0.9rem 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header.app-header .title { font-size: 1.05rem; font-weight: 600; }
  header.app-header .user { font-size: 0.85rem; opacity: 0.85; }
  header.app-header .version { font-size: 0.7rem; opacity: 0.6; }

  nav.tabs {
    display: flex;
    flex-wrap: wrap;
    background: var(--navy-light);
    padding: 0 1rem;
  }
  nav.tabs button {
    background: none;
    border: none;
    color: #cfd8e3;
    padding: 0.7rem 1rem;
    font-size: 0.85rem;
    cursor: pointer;
    border-bottom: 3px solid transparent;
  }
  nav.tabs button.active {
    color: #fff;
    border-bottom-color: #4f8ef7;
    font-weight: 600;
  }

  main { padding: 1.25rem; max-width: 1200px; margin: 0 auto; }
  .panel { display: none; }
  .panel.active { display: block; }

  .toolbar { display: flex; gap: 0.75rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
  select, input, textarea {
    padding: 0.45rem 0.6rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.9rem;
  }
  label { font-size: 0.8rem; color: var(--muted); display: block; margin-bottom: 0.25rem; }
  .field { margin-bottom: 0.9rem; }
  .field-row { display: flex; gap: 1rem; flex-wrap: wrap; }
  .field-row .field { flex: 1; min-width: 200px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
  .card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.1rem; }
  .card h3 { margin: 0 0 0.6rem; font-size: 0.85rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .card .big { font-size: 1.6rem; font-weight: 700; }
  .card .big.red { color: var(--red); }
  .card .big.green { color: var(--green); }
  .card ul { list-style: none; margin: 0; padding: 0; }
  .card li { padding: 0.35rem 0; border-bottom: 1px solid #eef0f2; font-size: 0.88rem; }
  .card li:last-child { border-bottom: none; }
  .card .empty { color: var(--muted); font-size: 0.85rem; }

  table.data-table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  table.data-table th, table.data-table td { padding: 0.55rem 0.7rem; text-align: left; font-size: 0.87rem; border-bottom: 1px solid #eef0f2; }
  table.data-table th { background: var(--navy); color: #fff; font-weight: 600; font-size: 0.78rem; text-transform: uppercase; }
  table.data-table tbody tr:hover { background: #fafbfc; }

  .amount-cell { font-weight: 600; }
  .amount-cell.green { color: var(--green); }
  .amount-cell.red { color: var(--red); }
  .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.72rem; font-weight: 600; }
  .badge.green { background: var(--green-bg); color: var(--green); }
  .badge.red { background: var(--red-bg); color: var(--red); }
  .badge.status-forecast { background: #fff4d6; color: #8a6100; }
  .badge.status-dialled { background: #e6f4ea; color: var(--green); }
  .badge.status-void { background: #eee; color: #777; }

  form.card-form { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem; max-width: 560px; }
  button.primary {
    background: var(--navy); color: #fff; border: none; border-radius: 6px;
    padding: 0.6rem 1.1rem; font-size: 0.9rem; cursor: pointer;
  }
  button.primary:hover { background: var(--navy-light); }
  button.secondary {
    background: #fff; color: var(--navy); border: 1px solid var(--border); border-radius: 6px;
    padding: 0.45rem 0.85rem; font-size: 0.82rem; cursor: pointer;
  }
  .msg { margin-top: 0.75rem; font-size: 0.85rem; }
  .msg.error { color: var(--red); }
  .msg.success { color: var(--green); }

  .section-title { font-size: 1.05rem; font-weight: 600; margin: 0 0 1rem; }
  .muted { color: var(--muted); font-size: 0.85rem; }
  .footer-version { text-align: right; font-size: 0.7rem; color: var(--muted); padding: 0.5rem 1.25rem; }
</style>
